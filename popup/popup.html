<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NK Currency</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <h1>NK Currency</h1>
      <p class="subtitle">Realtime page price converter</p>
    </header>

    <label class="field" for="currency">
      <span>Preferred currency</span>
      <select id="currency" aria-label="Preferred currency"></select>
    </label>

    <p id="modeHint" class="mode-hint"></p>

    <button type="button" id="convertBtn" class="btn primary">Convert this page</button>
    <button type="button" id="clearBtn" class="btn ghost">Clear conversions</button>

    <p id="status" class="status" role="status"></p>

    <nav class="nav">
      <a href="#" id="openSettings">Settings</a>
    </nav>

    <footer class="footer">
      <a href="https://nisalk.dev" target="_blank" rel="noopener noreferrer">nisalk · nisalk.dev</a>
    </footer>

    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
